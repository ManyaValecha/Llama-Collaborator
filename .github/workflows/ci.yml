name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run routing, memory, adaptation, API, and verifier checks
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(value for name, value in attrs if name == "id")
                  if tag == "script": self.active = True
              def handle_endtag(self, tag):
                  if tag == "script": self.active = False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)

          parser = ScriptExtractor()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          duplicates = [value for value, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f"Duplicate HTML ids: {duplicates}")
          Path("/tmp/llama-collaborator.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/llama-collaborator.js
